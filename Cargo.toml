[package]
name = "nightclock"
version = "1.0.0"
edition = "2021"
description = "NightClock – eine elegante Nachtuhr mit Wecker"
license = "MIT"
repository = "https://github.com/Nikiomedia/NightClock"
build = "build.rs"

[dependencies]
eframe = { version = "=0.31.1", default-features = false, features = ["glow", "default_fonts", "accesskit"] }
egui = "=0.31.1"
raw-window-handle = "0.6"
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rodio = { version = "0.20", default-features = false, features = ["symphonia-all"] }
ttf-parser = "0.25"
lyon_tessellation = "1"
rfd = "0.15"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Power",
    "Win32_Globalization",
] }

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
